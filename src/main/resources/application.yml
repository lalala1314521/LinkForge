spring:
  application:
    name: reference

  profiles:
    active: dev   # 默认激活开发环境，生产部署时改为 prod

  # ---- 数据源（使用 HikariCP 连接池）----
  datasource:
    url: jdbc:mysql://localhost:3306/demo_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 1800000

  # ---- JPA / Hibernate ----
  jpa:
    hibernate:
      ddl-auto: none          # 项目主要使用 MyBatis，JPA 仅作 Entity 映射，不自动管理 DDL
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # ---- Redis ----
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          min-idle: 2
          max-idle: 8
          max-active: 16
  #kafka订单异步通知
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      #发送失败时重试
      retries: 3
      #等待说有副本确认（数据安全优先）
      acks: all
      #批量发送优化
      batch-size: 16384 #16kb
      buffer-memory: 33554432 #32kb
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        #启用幂等性生产者（防止网络抖动导致冲复写入）
        enable.idempotence: true
    consumer:
      group-id: order-notification-group
      auto-offset-reset: earliest       # 新消费者从最早的消息开始消费
      enable-auto-commit: false         # 手动提交 offset，保证消息不丢失
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.project.mq.dto
      listener:
        # 一次拉取多少条消息批量处理
        batch-listener: false            # 单条模式（你的场景量不大）
        ack-mode: manual_immediate        # 手动确认：处理完一条立刻 ack
        concurrency: 3                    # 3 个并发消费者线程

# ---- MyBatis ----
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

# ---- JWT ----
jwt:
  secret: "SpringBootTutorialSecretKey_MinLength_32chars_OK"
  expiration-ms: 86400000   # 24 小时

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: health,info

# ---- 任务2: Redisson 分布式锁（单机模式，复用 Redis 配置）----
# redisson-spring-boot-starter 会自动读取 spring.data.redis 的连接信息
# 如需覆盖，可在此追加 spring.data.redis.redisson.config 配置

# ---- 任务1: Swagger/OpenAPI 配置 ----
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    groups-order: ASC
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json
