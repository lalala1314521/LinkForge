spring:
  application:
    name: LinkForge

  profiles:
    active: dev   # 默认激活开发环境，生产部署时改为 prod

  # ---- 数据源（使用 HikariCP 连接池）----
  datasource:
    url: jdbc:mysql://localhost:3306/demo_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 1800000

  # ---- 文件上传（multipart）----
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # ---- JPA / Hibernate ----
  jpa:
    hibernate:
      ddl-auto: none          # 项目主要使用 MyBatis，JPA 仅作 Entity 映射，不自动管理 DDL
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # ---- Redis ----
  data:
    redis:
      host: localhost
      port: 6379
      #password: 123456
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          min-idle: 2
          max-idle: 8
          max-active: 16
  #kafka订单异步通知
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      #发送失败时重试
      retries: 3
      #等待说有副本确认（数据安全优先）
      acks: all
      #批量发送优化
      batch-size: 16384 #16kb
      buffer-memory: 33554432 #32MB
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        #启用幂等性生产者（防止网络抖动导致冲复写入）
        enable.idempotence: true
    consumer:
      group-id: order-notification-group
      auto-offset-reset: earliest       # 新消费者从最早的消息开始消费
      enable-auto-commit: false         # 手动提交 offset，保证消息不丢失
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.project.mq.dto
      listener:
        # 一次拉取多少条消息批量处理
        batch-listener: false            # 单条模式（你的场景量不大）
        ack-mode: manual_immediate        # 手动确认：处理完一条立刻 ack
        concurrency: 3                    # 3 个并发消费者线程

# ---- MyBatis ----
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

# ---- JWT ----
jwt:
  secret: "SpringBootTutorialSecretKey_MinLength_32chars_OK"
  expiration-ms: 86400000   # 24 小时

# ---- 接口限流阈值 ----
rate-limit:
  login:
    max: 5              # 登录接口：每个IP 5次
    window: 60          # 窗口 60 秒
  register:
    max: 10             # 注册接口：每个IP 10次
    window: 3600        # 窗口 3600 秒
  global:
    qps: 100            # 全局接口单机 QPS 兜底（Guava）

# ---- 积分与可靠消息参数 ----
points:
  earn-ratio: 1            # 积分比例：1元 = 1积分（amount 由消费端按 finalAmount 换算后传入）

reliable-message:
  compensate:
    fixed-delay-ms: 30000   # 补偿任务扫描间隔（毫秒）
    lock-lease-seconds: 30   # 补偿任务分布式锁持有时间（秒），需 ≥ 扫描间隔/1000
    max-retries: 3           # 消息最大重试次数（写入 message_table.max_retries）
    backoff-base-seconds: 30 # 指数退避基数：30s × 2^n（上限 1h）

# ---- 秒杀参数 ----
seckill:
  topic:
    order: seckill-order    # 秒杀订单 topic（消费者监听）
  bloom:
    expected-insertions: 100000   # 布隆预期插入量（每活动，tryInit 一次性，容量变更需新活动）
    false-probability: 0.001      # 布隆误判率
  reconcile:
    fixed-delay-ms: 60000   # 秒杀库存对账任务扫描间隔（毫秒）

# ---- 订单超时关单（批次4）----
order:
  timeout-cancel:
    fixed-delay-ms: 60000   # 超时关单任务扫描间隔（毫秒）
    timeout-minutes: 15     # PENDING 订单超时分钟数

# ---- 接口幂等（批次4）----
idempotency:
  ttl-seconds: 300          # Idempotency-Key 键 TTL（秒），防 Redis 泄漏

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics   # 批次4：开放 metrics（Prometheus 可抓 /actuator/metrics；如需 /actuator/prometheus 需加 micrometer-registry-prometheus 依赖）

# ---- Redisson 分布式锁（单机模式，复用 Redis 配置）----
# redisson-spring-boot-starter 会自动读取 spring.data.redis 的连接信息
# 如需覆盖，可在此追加 spring.data.redis.redisson.config 配置

# ----  Swagger/OpenAPI 配置 ----
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    groups-order: ASC
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

# ---- 文件上传目录 ----
file:
  upload-dir: ./uploads   # 相对项目运行目录（IntelliJ 运行=项目根），WebMvcConfig 转绝对路径
