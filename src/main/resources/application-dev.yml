spring:
  jpa:
    hibernate:
      ddl-auto: update    # 开发环境自动建表
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456

# ---- 慢查询日志说明（HikariCP）----
# HikariCP 本身无慢查询拦截，通过以下方式实现：
# 1. SlowSqlInterceptor（MyBatis 插件）拦截 500ms+ 慢 SQL 打印 WARN 日志
# 2. MySQL 服务端可开启 slow_query_log: SET GLOBAL slow_query_log = ON; SET GLOBAL long_query_time = 0.5;

logging:
  level:
    com.example.project: debug
    org.springframework.security: debug
    #  开启 MyBatis SQL 打印（参数绑定详情）
    org.mybatis: debug
