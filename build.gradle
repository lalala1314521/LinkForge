plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
    compileOnly{
        extendsFrom annotationProcessor
    }
}

repositories {
	mavenCentral()
}

dependencies {
    //web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    //数据库（JPA+MyBatis + MySQL)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.0'
    runtimeOnly 'com.mysql:mysql-connector-j'

    //Redis缓存
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.apache.commons:commons-pool2'

    //spring security
	implementation 'org.springframework.boot:spring-boot-starter-security'

    //参数校验
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    //jwt(jjwt 0.12.x)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    //Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    //开发工具
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    //Swagger/OpenAPI接口文档
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    //Redisson分布式锁
    implementation 'org.redisson:redisson-spring-boot-starter:4.3.0'

    //接口限流
    implementation 'com.google.guava:guava:33.4.0-jre'

    //测试
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    //kafka消息队列（替代原有Spring Event)
    implementation 'org.springframework.boot:spring-boot-starter-kafka'

    //AOP（批次4：操作审计日志 @AuditLog 切面必需；Spring Boot 4 中 spring-boot-starter-aop 已改名为 spring-boot-starter-aspectj）
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'



	//implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// 限制并行测试 JVM（默认=CPU核数，用户机器 fork 17 个导致内存不足崩溃）
	maxParallelForks = 2
	// 每 100 个用例复用同一测试 JVM，减少进程创建开销
	forkEvery = 100
	// 限制测试 JVM 堆内存，防止多进程叠加 OOM
	jvmArgs '-Xmx512m'
}
